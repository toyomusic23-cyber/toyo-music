<!doctype html>
<html lang="ja" data-moment="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ランキング作成 — Toyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&display=swap">
<style>
/* Toyo 専用: おすすめランキングを作るページ（2026-09-27）。サイトのどこからもリンクしない・検索に出さない・計測しない。
   データは ../js/songs.js をそのまま読む。保存はこの端末だけ（localStorage）。結果は「順番をコピー」で Claude に渡す */
:root{--ink:#0b0b0c;--ink-2:#151517;--ink-3:#1f1f22;--paper:#f1eee8;--dim:#a8a49c;--line:rgba(241,238,232,.14);--line-2:rgba(241,238,232,.28);
  --accent:#3ee0c4;--accent-ink:#04211c;--warn:#ff8a5c;
  --display:"Archivo","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --gut:max(16px,env(safe-area-inset-left),env(safe-area-inset-right))}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 var(--gut)}
h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.2;margin-top:28px}
.lead{color:var(--dim);font-size:13.5px;margin-top:10px}
.lead ol{margin:8px 0 0 1.3em}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:3px;font-size:13px;font-weight:700}
.btn:hover{border-color:var(--paper)}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:18px}
.sec-h small{color:var(--dim);font-size:12px}
.cover{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cv{font-size:12px;padding:4px 10px;border:1px solid var(--line-2);border-radius:20px;color:var(--paper)}
.cv b{font-family:var(--display);margin-left:4px}
.cv.zero{border-color:var(--warn);color:var(--warn)}
.row{display:grid;grid-template-columns:auto 48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank .row{grid-template-columns:28px 48px minmax(0,1fr) 26px;align-items:start}
.rank .row .num,.rank .row .handle{align-self:center}
.rank .acts{margin-top:8px}
.num{font-family:var(--display);font-weight:800;font-size:18px;text-align:center;color:var(--accent)}
.row img{width:48px;height:48px;object-fit:cover;background:var(--ink-3)}
.t{font-weight:700;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.m{font-size:11.5px;color:var(--dim);margin-top:2px}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--line-2);border-radius:10px;padding:0 6px;margin-right:3px;color:var(--dim)}
.acts{display:flex;align-items:center;gap:6px}
.play{width:38px;height:38px;border-radius:50%;background:var(--ink-3);display:grid;place-items:center;flex:0 0 38px}
.play.on{background:var(--accent);color:var(--accent-ink)}
.tri{display:inline-block;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent currentColor;margin-left:3px}
.bars{display:inline-flex;gap:3px}.bars i{display:block;width:3px;height:11px;background:currentColor}
.star{min-width:74px;height:38px;border:1px solid var(--line-2);border-radius:3px;font-size:12.5px;font-weight:700}
.star.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.mini{width:34px;height:34px;border:1px solid var(--line);border-radius:3px;font-size:14px;display:grid;place-items:center}
.mini[disabled]{opacity:.3;cursor:default}
.handle{width:26px;height:38px;display:grid;place-items:center;color:var(--dim);cursor:grab;touch-action:none;font-size:18px;letter-spacing:-2px}
.empty{color:var(--dim);font-size:13px;padding:18px 0}
.ghost{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12.5px;padding:6px 12px;border:1px solid var(--line-2);border-radius:20px}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(21,21,23,.96);border-top:1px solid var(--line);padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0}
.bar .count{font-size:13px;color:var(--dim)}
.bar .count b{color:var(--paper);font-family:var(--display);font-size:18px;margin-right:2px}
.copy{min-height:46px;padding:0 20px;background:var(--accent);color:var(--accent-ink);border-radius:3px;font-weight:800;font-size:14px}
.out{width:100%;min-height:160px;margin-top:12px;background:var(--ink-3);color:var(--paper);border:1px solid var(--line-2);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.star{min-width:62px}.row{gap:8px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>おすすめランキングを作る</h1>
  <div class="lead">
    Toyo さん専用のページです（サイトからはリンクしていません）。
    <ol>
      <li>「全曲」で試聴しながら、推したい曲の「推し」を押す</li>
      <li>「ランキング」で順番を並べ替える（≡ を押したまま動かす／↑↓ でも動く）</li>
      <li>下の「順番をコピー」を押して、Claude に貼る</li>
    </ol>
    途中まででも、この端末に自動で保存されます。上位3曲が「まずはこの3曲」、時間帯に合う曲のうち順位の高い曲が「いまの時間の1曲」になります。
  </div>
  <div class="tools">
    <button class="btn" type="button" id="seed">Spotify の人気順で下書き</button>
    <button class="btn" type="button" id="reset">ランキングを空にする</button>
  </div>

  <section class="sec rank" aria-labelledby="rankH">
    <div class="sec-h"><h2 id="rankH">ランキング</h2><small id="rankCount"></small></div>
    <div class="cover" id="coverage" aria-label="時間帯ごとの推しの曲数"></div>
    <div id="rankList"></div>
  </section>

  <section class="sec" aria-labelledby="allH">
    <div class="sec-h"><h2 id="allH">全曲</h2><small id="allCount"></small></div>
    <div class="chips" id="chips"></div>
    <div id="allList"></div>
  </section>

  <section class="sec" id="outSec" hidden>
    <div class="sec-h"><h2>コピーできなかった時</h2></div>
    <p class="lead">下の文字を全部選んでコピーし、Claude に貼ってください。</p>
    <textarea class="out" id="out" readonly></textarea>
  </section>
</div>

<div class="bar"><div class="wrap">
  <div class="count"><b id="barN">0</b>曲を選択中</div>
  <button class="copy" type="button" id="copy">順番をコピー</button>
</div></div>

<audio id="audio" preload="none"></audio>
<script src="../js/songs.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'toyo_rank_v1';
  const TIME = { morning: '朝', day: '昼', evening: '夕方', night: '夜' };
  // 2026-09-27 時点の Spotify 公開ページの人気曲（上から）。下書き用
  const SPOTIFY_TOP = ['Signal Lost', 'Lost & Found', '折り紙', 'Low Friquency', '巻き戻し', '夜のコインランドリー', 'BLUE PRIDE', "I'm Always Back", 'Same Night', '改札の音'];
  const songs = SONGS.slice();
  const byKey = new Map(songs.map(s => [s.key, s]));
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let rank = [];
  try { rank = (JSON.parse(localStorage.getItem(KEY) || '[]') || []).filter(k => byKey.has(k)); } catch (e) { rank = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rank)); } catch (e) {} };
  let filter = 'all', playing = '';
  const audio = $('#audio');

  const tags = s => (s.time || []).map(t => `<span class="tag">${TIME[t] || t}</span>`).join('');
  const playBtn = s => `<button class="play${playing === s.key ? ' on' : ''}" type="button" data-play="${s.key}" aria-label="${esc(s.title)} を試聴">${playing === s.key ? '<span class="bars"><i></i><i></i></span>' : '<i class="tri"></i>'}</button>`;
  const img = s => `<img src="../covers/${s.key}-240.webp" alt="" width="48" height="48" loading="lazy" onerror="this.onerror=null;this.src='../covers/${s.key}-640.jpg'">`;
  const meta = s => `<div class="m">${esc(s.moodJa || s.mood || '')}</div><div style="margin-top:3px">${tags(s)}</div>`;

  function renderRank() {
    const box = $('#rankList');
    $('#rankCount').textContent = rank.length ? `${rank.length}曲` : '';
    $('#barN').textContent = rank.length;
    const cnt = { morning: 0, day: 0, evening: 0, night: 0 };
    rank.forEach(k => (byKey.get(k).time || []).forEach(t => { if (t in cnt) cnt[t]++; }));
    $('#coverage').innerHTML = Object.keys(TIME).map(t => `<span class="cv${cnt[t] ? '' : ' zero'}">${TIME[t]}<b>${cnt[t]}</b></span>`).join('')
      + (Object.values(cnt).some(v => !v) ? '<span class="m" style="align-self:center">0 の時間帯は、今までどおり日替わりで選びます</span>' : '');
    if (!rank.length) { box.innerHTML = '<p class="empty">まだありません。下の「全曲」で「推し」を押すか、「Spotify の人気順で下書き」から始めてください。</p>'; return; }
    box.innerHTML = rank.map((k, i) => { const s = byKey.get(k); return `
      <div class="row" data-key="${k}">
        <div class="num">${i + 1}</div>${img(s)}
        <div><div class="t">${esc(s.title)}</div>${meta(s)}
          <div class="acts">${playBtn(s)}
            <button class="mini" type="button" data-up="${k}" aria-label="${esc(s.title)} を1つ上へ" ${i ? '' : 'disabled'}>↑</button>
            <button class="mini" type="button" data-down="${k}" aria-label="${esc(s.title)} を1つ下へ" ${i < rank.length - 1 ? '' : 'disabled'}>↓</button>
            <button class="mini" type="button" data-star="${k}" aria-label="${esc(s.title)} をランキングから外す">×</button>
          </div></div>
        <span class="handle" aria-hidden="true">≡</span>
      </div>`; }).join('');
  }

  function renderAll() {
    const chips = [['all', 'すべて'], ...Object.entries(TIME), ['rest', 'まだ推していない']];
    $('#chips').innerHTML = chips.map(([k, v]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${v}</button>`).join('');
    const list = songs.filter(s => filter === 'all' ? true : filter === 'rest' ? !rank.includes(s.key) : (s.time || []).includes(filter));
    $('#allCount').textContent = `${list.length}曲`;
    $('#allList').innerHTML = list.map(s => { const n = rank.indexOf(s.key) + 1; return `
      <div class="row" data-key="${s.key}">
        <div></div>${img(s)}
        <div><div class="t">${esc(s.title)}</div>${meta(s)}</div>
        <div class="acts">${playBtn(s)}<button class="star${n ? ' on' : ''}" type="button" data-star="${s.key}" aria-pressed="${!!n}">${n ? `推し ${n}位` : '☆ 推し'}</button></div>
      </div>`; }).join('');
  }
  const render = () => { renderRank(); renderAll(); save(); };

  const move = (k, d) => { const i = rank.indexOf(k), j = i + d; if (i < 0 || j < 0 || j >= rank.length) return; [rank[i], rank[j]] = [rank[j], rank[i]]; render(); };
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.play) {
      const k = b.dataset.play;
      if (playing === k) { audio.pause(); playing = ''; }
      else { audio.src = `../audio/${k}.m4a`; audio.currentTime = 0; audio.play().catch(() => {}); playing = k; }
      render(); return;
    }
    if (b.dataset.star) { const k = b.dataset.star, i = rank.indexOf(k); if (i >= 0) rank.splice(i, 1); else rank.push(k); render(); return; }
    if (b.dataset.up) return move(b.dataset.up, -1);
    if (b.dataset.down) return move(b.dataset.down, 1);
    if (b.dataset.f) { filter = b.dataset.f; renderAll(); return; }
  });
  audio.addEventListener('ended', () => { playing = ''; render(); });

  $('#seed').addEventListener('click', () => {
    if (rank.length && !confirm('今のランキングを、Spotify の人気順（上位10曲）で置き換えますか？')) return;
    rank = SPOTIFY_TOP.map(t => songs.find(s => s.title === t)).filter(Boolean).map(s => s.key); render();
  });
  $('#reset').addEventListener('click', () => { if (rank.length && confirm('ランキングを空にしますか？')) { rank = []; render(); } });

  $('#copy').addEventListener('click', async () => {
    if (!rank.length) { alert('まだ1曲も選ばれていません'); return; }
    const text = `【おすすめランキング】\n${rank.map((k, i) => `${i + 1}. ${byKey.get(k).title}`).join('\n')}\n\nRANK_KEYS:${JSON.stringify(rank)}`;
    try { await navigator.clipboard.writeText(text); $('#copy').textContent = 'コピーしました ✓'; setTimeout(() => ($('#copy').textContent = '順番をコピー'), 2000); }
    catch (e) { $('#outSec').hidden = false; $('#out').value = text; $('#out').focus(); $('#out').select(); }
  });

  render();
  const sc = document.createElement('script');
  sc.src = 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js';
  sc.onload = () => Sortable.create($('#rankList'), {
    handle: '.handle', animation: 160, ghostClass: 'ghost', draggable: '.row',
    onEnd: () => { rank = [...document.querySelectorAll('#rankList .row')].map(r => r.dataset.key); render(); },
  });
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
